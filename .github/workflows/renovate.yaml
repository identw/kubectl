name: Renovate
concurrency:
  group: 'renovate'
  cancel-in-progress: true

on:
  workflow_dispatch:
  schedule:
    - cron: '11 3 * * 1'

jobs:
  renovate:
    permissions:
      contents: write
      pull-requests: write
      issues: write
      statuses: write
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@main

      # renovatebot/github-action mounts only the config file into the Renovate
      # container (/github-action/...), so scanning Dockerfiles via __dirname
      # yields empty packageRules. Materialize rules from the workspace first.
      - name: Materialize Renovate bot config
        run: node .github/renovate_config.js > .github/renovate_config.generated.js

      - name: Run Renovate
        uses: renovatebot/github-action@v43.0.3
        with:
          configurationFile: .github/renovate_config.generated.js
          token: ${{ secrets.GITHUB_TOKEN }}
        env:
          LOG_LEVEL: debug

  # GITHUB_TOKEN merges/PRs do not trigger other workflows — automerge here.
  automerge:
    needs: renovate
    permissions:
      contents: write
      pull-requests: write
      packages: write
      checks: write
    uses: ./.github/workflows/automerge_renovate.yml
    secrets: inherit
