name: Tag kubectl version

on:
  pull_request:
    types: [closed]

jobs:
  tag-kubectl:
    # Covers human merges of renovate PRs and new-minor PRs.
    # Bot automerge path is handled in automerge_renovate.yml.
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest

    permissions:
      contents: write
      packages: write
      checks: write

    steps:
      - uses: actions/checkout@main
        with:
          fetch-depth: 0
          ref: main

      - name: Create tags/releases for new kubectl versions in PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          DOCKER_USER: ${{ secrets.DOCKER_USER }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
          IMAGE: ${{ github.repository }}
          GITHUB_USER: ${{ github.repository_owner }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          chmod +x .github/scripts/*.sh .github/scripts/*.py
          .github/scripts/tag_and_publish_from_pr.sh
