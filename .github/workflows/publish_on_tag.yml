name: Push tag version
on:
  push:
    tags:
      - 'v*.*.*'
permissions:
  checks: write
  contents: read
  packages: write
jobs:
  docker-build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@main
      - name: Publish version tag to registry
        env:
          DOCKER_USER: ${{ secrets.DOCKER_USER }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
          IMAGE: ${{ github.repository }}
          GITHUB_USER: ${{ github.repository_owner }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          chmod +x .github/scripts/*.sh
          RELEASE_VERSION="${GITHUB_REF_NAME}"
          MINOR="$(echo "${RELEASE_VERSION}" | sed -E 's/^(v[0-9]+\.[0-9]+)\.[0-9]+$/\1/')"
          DOCKERFILE="Dockerfile_${MINOR}.x"
          if [ ! -f "${DOCKERFILE}" ]; then
            echo "Missing ${DOCKERFILE} for tag ${RELEASE_VERSION}"
            exit 1
          fi
          .github/scripts/docker_publish.sh "${DOCKERFILE}" "${RELEASE_VERSION}"
