name: Push tag version
on:
  push:
    tags:
      - 'v*.*.*'
permissions:
  checks: write
  contents: read
  packages: write
jobs:
  docker-build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@main
      - name: Set env
        run: |
          RELEASE_VERSION="${GITHUB_REF_NAME}"
          MINOR="$(echo "${RELEASE_VERSION}" | sed -E 's/^(v[0-9]+\.[0-9]+)\.[0-9]+$/\1/')"
          DOCKERFILE="Dockerfile_${MINOR}.x"
          if [ ! -f "${DOCKERFILE}" ]; then
            echo "Missing ${DOCKERFILE} for tag ${RELEASE_VERSION}"
            exit 1
          fi
          echo "RELEASE_VERSION=${RELEASE_VERSION}" >> "$GITHUB_ENV"
          echo "DOCKERFILE=${DOCKERFILE}" >> "$GITHUB_ENV"
      - name: Publish version tag to registry
        env:
          DOCKER_USER: ${{ secrets.DOCKER_USER }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
          IMAGE: ${{ github.repository }}
          GITHUB_USER: ${{ github.repository_owner }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          docker version
          docker build -f "${DOCKERFILE}" -t "docker.io/${IMAGE}:${RELEASE_VERSION}" .
          docker tag "docker.io/${IMAGE}:${RELEASE_VERSION}" "ghcr.io/${IMAGE}:${RELEASE_VERSION}"
          docker login -u "$DOCKER_USER" -p "$DOCKER_PASSWORD"
          docker push "docker.io/${IMAGE}:${RELEASE_VERSION}"
          docker login -u "${GITHUB_USER}" -p "${GITHUB_TOKEN}" ghcr.io
          docker push "ghcr.io/${IMAGE}:${RELEASE_VERSION}"
