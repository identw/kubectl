name: Detect new kubectl minor

on:
  workflow_dispatch:
  schedule:
    - cron: '17 4 * * 1'

permissions:
  contents: write
  pull-requests: write
  packages: write
  checks: write

jobs:
  detect-new-minor:
    runs-on: ubuntu-latest
    outputs:
      created_pr: ${{ steps.detect.outputs.created_pr }}
    steps:
      - uses: actions/checkout@main

      - name: Find missing kubectl minors and open PR
        id: detect
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          echo "created_pr=false" >> "$GITHUB_OUTPUT"

          python3 <<'PY'
          import json, os, re, urllib.request
          from pathlib import Path

          ROOT = Path('.')
          DOCKERFILE_RE = re.compile(r'^Dockerfile_v(\d+)\.(\d+)\.x$')

          def http_get(url):
              req = urllib.request.Request(
                  url,
                  headers={
                      'Accept': 'application/vnd.github+json',
                      'User-Agent': 'identw-kubectl-new-minor',
                      'Authorization': f"Bearer {os.environ['GH_TOKEN']}",
                      'X-GitHub-Api-Version': '2022-11-28',
                  },
              )
              with urllib.request.urlopen(req) as resp:
                  return json.load(resp)

          def existing_minors():
              out = {}
              for path in ROOT.glob('Dockerfile_v*.x'):
                  m = DOCKERFILE_RE.match(path.name)
                  if not m:
                      continue
                  out[(int(m.group(1)), int(m.group(2)))] = path
              return out

          def latest_alpine(existing):
              if not existing:
                  return '3.24.1'
              newest = max(existing)
              text = existing[newest].read_text()
              m = re.search(r'FROM docker\.io/alpine:(\d+\.\d+\.\d+)', text)
              if not m:
                  raise SystemExit(f'Cannot parse alpine from {existing[newest]}')
              return m.group(1)

          def dockerfile_body(alpine, kubectl):
              return (
                  f'FROM docker.io/alpine:{alpine}\n'
                  f'LABEL org.opencontainers.image.source https://github.com/identw/kubectl\n'
                  f'\n'
                  f'RUN apk add --no-cache curl bash \\\n'
                  f'    && curl -L https://dl.k8s.io/release/v{kubectl}/bin/linux/amd64/kubectl -o /usr/local/bin/kubectl \\\n'
                  f'    && chmod +x /usr/local/bin/kubectl\n'
              )

          releases = []
          for page in range(1, 6):
              batch = http_get(
                  f'https://api.github.com/repos/kubernetes/kubernetes/releases?per_page=100&page={page}'
              )
              if not batch:
                  break
              releases.extend(batch)

          latest_by_minor = {}
          for rel in releases:
              if rel.get('prerelease') or rel.get('draft'):
                  continue
              tag = rel.get('tag_name') or ''
              m = re.match(r'^v(\d+)\.(\d+)\.(\d+)$', tag)
              if not m:
                  continue
              major, minor, patch = map(int, m.groups())
              if major != 1 or minor < 25:
                  continue
              key = (major, minor)
              ver = (patch, tag[1:])
              if key not in latest_by_minor or ver > latest_by_minor[key]:
                  latest_by_minor[key] = ver

          existing = existing_minors()
          missing = sorted(set(latest_by_minor) - set(existing))
          if not missing:
              print('No new kubectl minor versions to add')
              raise SystemExit(0)

          alpine = latest_alpine(existing)
          created = []
          for key in missing:
              major, minor = key
              kubectl = latest_by_minor[key][1]
              name = f'Dockerfile_v{major}.{minor}.x'
              Path(name).write_text(dockerfile_body(alpine, kubectl))
              created.append((name, kubectl))
              print(f'Created {name} with kubectl v{kubectl}')

          summary = ', '.join(f'{n} (v{v})' for n, v in created)
          files = ' '.join(n for n, _ in created)
          Path('/tmp/new_minors_has_changes').write_text('true')
          Path('/tmp/new_minors_files').write_text(files)
          Path('/tmp/new_minors_summary').write_text(summary)
          PY

          if [ ! -f /tmp/new_minors_has_changes ]; then
            exit 0
          fi

          NEW_FILES="$(cat /tmp/new_minors_files)"
          SUMMARY="$(cat /tmp/new_minors_summary)"

          BRANCH="chore/new-kubectl-minor-$(date +%Y%m%d%H%M%S)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "${BRANCH}"
          # shellcheck disable=SC2086
          git add ${NEW_FILES}
          git commit -m "Add Dockerfiles for new kubectl minor versions"

          git push -u origin "${BRANCH}"

          gh pr create \
            --repo "${REPO}" \
            --title "Add Dockerfiles for new kubectl minor versions" \
            --body "$(cat <<EOF
          ## Summary
          New kubectl minor release(s) detected. Added:
          - ${SUMMARY}

          Eligible for automerge when the new Dockerfile(s) match the existing template
          (only kubectl version differs). After merge: tag, GitHub release, image publish,
          and README table update.

          EOF
          )"

          echo "created_pr=true" >> "$GITHUB_OUTPUT"

  # GITHUB_TOKEN PRs do not trigger pull_request workflows — automerge here.
  automerge:
    needs: detect-new-minor
    if: needs.detect-new-minor.outputs.created_pr == 'true'
    permissions:
      contents: write
      pull-requests: write
      packages: write
      checks: write
    uses: ./.github/workflows/automerge_renovate.yml
    secrets: inherit
