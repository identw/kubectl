name: Detect new kubectl minor

on:
  workflow_dispatch:
  schedule:
    - cron: '17 4 * * 1'

permissions:
  contents: write
  pull-requests: write
  packages: write
  checks: write

jobs:
  detect-new-minor:
    runs-on: ubuntu-latest
    outputs:
      created_pr: ${{ steps.detect.outputs.created_pr }}
    steps:
      - uses: actions/checkout@main

      - name: Find missing kubectl minors and open PR
        id: detect
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          chmod +x .github/scripts/*.sh .github/scripts/*.py
          .github/scripts/open_new_minor_pr.sh

  # GITHUB_TOKEN PRs do not trigger pull_request workflows — automerge here.
  automerge:
    needs: detect-new-minor
    if: needs.detect-new-minor.outputs.created_pr == 'true'
    permissions:
      contents: write
      pull-requests: write
      packages: write
      checks: write
    uses: ./.github/workflows/automerge_renovate.yml
    secrets: inherit
